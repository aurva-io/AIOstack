n8n:
  enabled: true
  replicaCount: 1

  image:
    repository: n8nio/n8n
    pullPolicy: IfNotPresent
    tag: "latest"

  service:
    type: ClusterIP
    port: 5678
    targetPort: 5678
    annotations: {}

  httproute:
    enabled: false
    name: n8n
    gateway:
      name: aurva-private-gateway
      namespace: kube-system
    host: "n8n.internal.staging.aurva.io"
    service:
      name: ""
      port: 5678
    matches:
      - path:
          type: PathPrefix
          value: /

  healthCheckPolicy:
    enabled: false
    name: n8n
    logConfig:
      enabled: false
    config:
      type: HTTP
      httpHealthCheck:
        port: 5678
        requestPath: /healthz
    serviceName: ""

  ingress:
    enabled: true
    className: "alb"
    annotations:
      alb.ingress.kubernetes.io/actions.ssl-redirect: >-
        {"Type": "redirect", "RedirectConfig":{"Protocol":"HTTPS","Port":"443","StatusCode":"HTTP_301"}}
      alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:145689162369:certificate/96d9c3f0-e3cb-4234-9e03-69ba895e76e1
      alb.ingress.kubernetes.io/group.name: aurva-internal
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS":443}]'
      alb.ingress.kubernetes.io/load-balancer-name: aurva-internal
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-Ext1-2021-06
      alb.ingress.kubernetes.io/ssl-redirect: "443"
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/wafv2-acl-arn: arn:aws:wafv2:ap-south-1:145689162369:regional/webacl/aurva-aws-prod-waf/f63d3c29-c9ef-4fcd-84a5-bbdade6c4866
    sslRedirect:
      enabled: true
      serviceName: ssl-redirect
      servicePortName: use-annotation
      path: /
      pathType: Exact
    hosts:
      - host: n8n.internal.aurva.io
        paths:
          - path: /
            pathType: Prefix
    tls: []

  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 20Gi
    annotations: {}

  resources:
    requests:
      cpu: 250m
      memory: 512Mi

  nodeSelector: {}

  tolerations: []

  affinity: {}

  env:
    - name: N8N_HOST
      value: "0.0.0.0"
    - name: N8N_PORT
      value: "5678"
    - name: N8N_PROTOCOL
      value: "http"
    - name: NODE_ENV
      value: "production"
    - name: EXECUTIONS_DATA_SAVE_ON_SUCCESS
      value: "all"
    - name: EXECUTIONS_DATA_SAVE_ON_ERROR
      value: "all"
    - name: EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS
      value: "true"

  # Additional environment variables
  extraEnv: []

  serviceAccount:
    create: true
    annotations: {}
    name: "n8n-sa"

  # Security context
  securityContext: {}

  podSecurityContext:
    fsGroup: 1000

  # Probes
  livenessProbe:
    httpGet:
      path: /healthz
      port: 5678
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /healthz
      port: 5678
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
