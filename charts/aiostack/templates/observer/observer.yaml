{{- if .Values.observer.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: aiostack-observer
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: aiostack-observer
      app.kubernetes.io/name: aiostack-observer
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: aiostack-observer
        app.kubernetes.io/name: aiostack-observer
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Values.observer.serviceAccount.name | default "aiostack-observer-sa" }}
      dnsPolicy: "ClusterFirst"
      initContainers:
      - name: wait-for-outpost
        image: busybox:1.36
        command: ['sh', '-c']
        args:
        - |
          echo "Waiting for outpost gRPC service to be ready..."
          OUTPOST_HOST="aiostack-outpost.{{ .Release.Namespace }}.svc.cluster.local"
          OUTPOST_PORT="{{ .Values.global.outpost.port }}"
          MAX_RETRIES=60
          RETRY_COUNT=0

          until nc -z $OUTPOST_HOST $OUTPOST_PORT; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
              echo "Timeout: Outpost service did not become ready after $MAX_RETRIES attempts"
              exit 1
            fi
            echo "Outpost gRPC service not ready yet (attempt $RETRY_COUNT/$MAX_RETRIES), waiting 5 seconds..."
            sleep 5
          done
          echo "Outpost gRPC service is ready!"
      containers:
      - name: observer
        image: "public.ecr.aws/l5a6x1y4/aiostack-observer:{{ .Values.observer.version }}"
        imagePullPolicy: "Always"
        env:
        - name: LOG_ENV
          value: "production"
        - name: OUTPOST_URL
          value: "aiostack-outpost.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.global.outpost.port }}"
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        {{- range .Values.observer.env }}
        {{- if and (ne .name "OUTPOST_URL") (ne .name "NODE_NAME") }}
        - name: {{ .name }}
          value: {{ .value | quote }}
        {{- end }}
        {{- end }}
        securityContext:
          privileged: true
          capabilities:
            add:
            - SYS_ADMIN
            - SYS_RESOURCE
            - SYS_PTRACE
            - NET_ADMIN
        volumeMounts:
        - name: host-proc
          mountPath: /host/proc
          readOnly: true
        - name: host-sys
          mountPath: /host/sys
          readOnly: true
        - name: bpf-maps
          mountPath: /sys/fs/bpf
        - name: debugfs
          mountPath: /sys/kernel/debug
      volumes:
      - name: host-proc
        hostPath:
          path: /proc
      - name: host-sys
        hostPath:
          path: /sys
      - name: bpf-maps
        hostPath:
          path: /sys/fs/bpf
      - name: debugfs
        hostPath:
          path: /sys/kernel/debug
{{- end }}
