---
# etcd PVC
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: etcd-storage
  labels:
    app: etcd
    project: aibender
    layer: infrastructure
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
# etcd StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd
  labels:
    app: etcd
    project: aibender
    layer: infrastructure
spec:
  serviceName: etcd
  replicas: 1
  selector:
    matchLabels:
      app: etcd
  template:
    metadata:
      labels:
        app: etcd
        project: aibender
        layer: infrastructure
    spec:
      containers:
      - name: etcd
        image: quay.io/coreos/etcd:v3.5.12
        command:
        - etcd
        - --name=etcd0
        - --data-dir=/etcd-data
        - --listen-client-urls=http://0.0.0.0:2379
        - --advertise-client-urls=http://etcd:2379
        - --listen-peer-urls=http://0.0.0.0:2380
        - --initial-advertise-peer-urls=http://etcd-0.etcd:2380
        - --initial-cluster=etcd0=http://etcd-0.etcd:2380
        - --auto-compaction-mode=periodic
        - --auto-compaction-retention=1h
        ports:
        - containerPort: 2379
          name: client
        - containerPort: 2380
          name: peer
        volumeMounts:
        - name: etcd-storage
          mountPath: /etcd-data
        livenessProbe:
          httpGet:
            path: /health
            port: 2379
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 2379
          initialDelaySeconds: 15
          periodSeconds: 5
        resources:
          requests:
            memory: 256Mi
            cpu: 100m
          limits:
            memory: 512Mi
            cpu: 250m
      volumes:
      - name: etcd-storage
        persistentVolumeClaim:
          claimName: etcd-storage
---
# etcd Service
apiVersion: v1
kind: Service
metadata:
  name: etcd
  labels:
    app: etcd
    project: aibender
    layer: infrastructure
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: 2379
    targetPort: 2379
    name: client
  - port: 2380
    targetPort: 2380
    name: peer
  selector:
    app: etcd
