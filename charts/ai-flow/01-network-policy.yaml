# Keep unauthenticated traffic generators reachable only within this namespace.
# Requires a CNI that enforces Kubernetes NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: namespace-ingress-only
  namespace: aibender
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
