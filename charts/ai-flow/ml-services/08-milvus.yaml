---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: milvus-storage
  labels:
    app: milvus
    project: aibender
    layer: ml-services
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: milvus
  labels:
    app: milvus
    project: aibender
    layer: ml-services
spec:
  replicas: 1
  selector:
    matchLabels:
      app: milvus
  template:
    metadata:
      labels:
        app: milvus
        project: aibender
        layer: ml-services
    spec:
      containers:
      - name: milvus
        image: milvusdb/milvus:latest
        command:
        - milvus
        - run
        - standalone
        ports:
        - containerPort: 19530
          name: grpc
        - containerPort: 9091
          name: metrics
        env:
        - name: ETCD_ENDPOINTS
          value: "etcd:2379"
        - name: MINIO_ADDRESS
          value: "minio:9000"
        - name: MINIO_ACCESS_KEY_ID
          value: "minioadmin"
        - name: MINIO_SECRET_ACCESS_KEY
          value: "minioadmin123"
        volumeMounts:
        - name: milvus-storage
          mountPath: /var/lib/milvus
        resources:
          requests:
            memory: 1Gi
            cpu: 500m
          limits:
            memory: 2Gi
            cpu: 1000m
      volumes:
      - name: milvus-storage
        persistentVolumeClaim:
          claimName: milvus-storage
---
apiVersion: v1
kind: Service
metadata:
  name: milvus
  labels:
    app: milvus
    project: aibender
    layer: ml-services
spec:
  type: ClusterIP
  ports:
  - port: 19530
    targetPort: 19530
    name: grpc
  - port: 9091
    targetPort: 9091
    name: metrics
  selector:
    app: milvus
