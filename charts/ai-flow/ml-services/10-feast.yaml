---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: feast
  labels:
    app: feast
    project: aibender
    layer: ml-services
spec:
  replicas: 1
  selector:
    matchLabels:
      app: feast
  template:
    metadata:
      labels:
        app: feast
        project: aibender
        layer: ml-services
    spec:
      containers:
      - name: feast
        image: feastdev/feature-server:latest
        ports:
        - containerPort: 6566
          name: http
        env:
        - name: FEAST_FEATURE_STORE_PATH
          value: "/feature_store"
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aibender-credentials
              key: minio-user
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aibender-credentials
              key: minio-password
        - name: AWS_ENDPOINT_URL
          value: "http://minio:9000"
        volumeMounts:
        - name: feast-config
          mountPath: /feature_store
        resources:
          requests:
            memory: 256Mi
            cpu: 100m
          limits:
            memory: 512Mi
            cpu: 250m
      volumes:
      - name: feast-config
        secret:
          secretName: aibender-credentials
          items:
          - key: feature_store.yaml
            path: feature_store.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: feast
  labels:
    app: feast
    project: aibender
    layer: ml-services
spec:
  type: ClusterIP
  ports:
  - port: 6566
    targetPort: 6566
    name: http
  selector:
    app: feast
