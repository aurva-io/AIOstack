<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>AIOStack — Runtime map of every AI in your cluster</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site.css"/>
  <link rel="stylesheet" href="v4.css"/>
</head>
<body class="v4-body">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="components/primitives.jsx"></script>
  <script type="text/babel" src="components/v4-sections.jsx"></script>

  <script type="text/babel">
    function App() {
      return (
        <>
          <NavBar/>
          <div className="v4-frame">
            <HeroV4/>
            <Observatories/>
            <HowItWorksV4/>
            <OutcomesV4/>
            <RosterV4/>
            <FinalCTAV4/>
          </div>
          <Footer/>
        </>
      );
    }
    function mount() {
      if (typeof NavBar === "undefined" || typeof HeroV4 === "undefined" ||
          typeof Observatories === "undefined" || typeof HowItWorksV4 === "undefined" ||
          typeof OutcomesV4 === "undefined" || typeof RosterV4 === "undefined" ||
          typeof FinalCTAV4 === "undefined") {
        return setTimeout(mount, 30);
      }
      ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
    }
    mount();
  </script>
</body>
</html>
