<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>AIOStack Docs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site.css"/>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="components/primitives.jsx"></script>
  <script type="text/babel" src="components/docs-shell.jsx"></script>

  <script type="text/babel">
    function App() {
      return (
        <>
          <NavBar active="docs"/>
          <div className="docs-shell">
            <DocsSidebar activeId="introduction"/>
            <main className="docs-main">
              <DocsBreadcrumb trail={["Docs", "Get started", "Introduction"]}/>
              <h1>AIOStack documentation</h1>
              <p style={{ fontSize: 17, color: "var(--space-text-2)", lineHeight: 1.6, marginTop: -4, textWrap: "pretty" }}>
                Runtime AI observability that installs in ten minutes. AIOStack discovers every AI service running across your environment with eBPF and read-only Cloud APIs — without changing a single line of application code.
              </p>

              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14, marginTop: 28 }}>
                <DocsCard icon="rocket" title="Quickstart" body="Install AIOStack into a Kubernetes cluster and surface your first AI inventory in ten minutes." href="docs-quickstart.html"/>
                <DocsCard icon="cube" title="Architecture" body="How the eBPF agent, Cloud-API enricher, and console fit together — and why nothing leaves your VPC." href="#"/>
                <DocsCard icon="graph" title="Identity graph" body="Trace ServiceAccounts → IAM roles → policies → reachable assets, automatically." href="#"/>
                <DocsCard icon="terminal" title="CLI reference" body="Every aiostack CLI command, with examples for the most common workflows." href="#"/>
              </div>

              <h2 id="what-is">What is AIOStack?</h2>
              <p>AIOStack is a free, self-hosted runtime AI observability platform. It auto-discovers every AI service, agent, LLM, and self-hosted model in your Kubernetes and cloud environments. It captures inbound and outbound prompts, generates a live AI Bill of Materials, and maps non-human identity end-to-end — from <code>ServiceAccount</code> to <code>IAM</code> role to the exact resources your agents can reach.</p>
              <p>It runs entirely inside your cluster. No SaaS dependency. No telemetry leaves your VPC.</p>

              <DocsCallout kind="tip" title="Free, forever">
                <p style={{ margin: 0 }}>AIOStack is free to install and use. There is no signup, no credit card, no opt-in telemetry. If you'd like sensitive-data discovery in your databases, see <a href="#">Aurva Enterprise</a>.</p>
              </DocsCallout>

              <h2 id="how-it-works">How it works</h2>
              <p>AIOStack runs as a small, privileged DaemonSet. The agent attaches eBPF probes to socket and syscall paths, observing every flow at the kernel layer. A read-only Cloud API enricher fills in the identity picture — <code>ServiceAccount</code> → <code>AssumeRole</code> → IAM policies → resources.</p>
              <ol>
                <li><strong>Discover</strong> — every workload that calls an LLM endpoint, loads a model, or uses an embedding library is detected within the first 60 seconds.</li>
                <li><strong>Map</strong> — Cloud APIs (read-only) build the identity graph, including IAM, RDS, and metadata services.</li>
                <li><strong>Trace</strong> — prompts and responses are captured at the wire layer, with PII redaction applied before storage.</li>
                <li><strong>Surface</strong> — risks like overly-permissive identities, naked pods, and shadow AI are flagged in real time.</li>
              </ol>

              <h2 id="install">Install</h2>
              <p>One command provisions everything. By default the agent is installed into the <code>aiostack</code> namespace and the console is exposed on <code>aiostack.local</code> via a port-forward.</p>

              <DocsCodeBlock label="install · ~10 min">
                <span className="tok-prompt">$</span> <span className="tok-cmd">curl</span> <span className="tok-flag">-fsSL</span> <span className="tok-str">https://aurva.ai/install.sh</span> | <span className="tok-cmd">bash</span>
              </DocsCodeBlock>

              <p>Or install via Helm if you prefer to manage the chart yourself:</p>

              <DocsCodeBlock label="helm">
                <span className="tok-prompt">$</span> <span className="tok-cmd">helm repo add</span> <span className="tok-str">aiostack https://charts.aurva.ai</span>
                {"\n"}<span className="tok-prompt">$</span> <span className="tok-cmd">helm install</span> <span className="tok-str">aiostack aiostack/aiostack</span> <span className="tok-flag">-n aiostack --create-namespace</span>
              </DocsCodeBlock>

              <DocsCallout kind="warn" title="Kernel requirements">
                <p style={{ margin: 0 }}>The eBPF agent needs Linux kernel <strong>4.18+</strong> with BTF enabled. Most production distros (EKS, GKE, AKS, Bottlerocket, COS, Ubuntu 20+) qualify out of the box. See <a href="#">System requirements</a>.</p>
              </DocsCallout>

              <h2 id="next">Next steps</h2>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14, marginTop: 8 }}>
                <DocsCard icon="rocket" title="Run the quickstart" body="Walk through your first install end-to-end in under ten minutes." href="docs-quickstart.html"/>
                <DocsCard icon="graph" title="Explore the identity graph" body="Understand non-human identity end-to-end and surface risk early." href="#"/>
                <DocsCard icon="package" title="Generate your first AIBOM" body="Export a CycloneDX AIBOM of every model and dependency." href="#"/>
                <DocsCard icon="dollar" title="Upgrade to Enterprise" body="Add sensitive-data discovery in your databases via Aurva Enterprise." href="#"/>
              </div>

              <div style={{ marginTop: 56, padding: "20px 0", borderTop: "1px solid var(--space-line)", display: "flex", justifyContent: "space-between", fontSize: 13.5 }}>
                <a href="docs.html" style={{ color: "var(--space-text-3)" }}>← Docs home</a>
                <a href="docs-quickstart.html" style={{ color: "var(--aio-primary-300)" }}>Quickstart →</a>
              </div>
            </main>
          </div>
          <Footer/>
        </>
      );
    }
    function mount() {
      if (typeof NavBar === "undefined" || typeof DocsSidebar === "undefined") return setTimeout(mount, 30);
      ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
    }
    mount();
  </script>
</body>
</html>
