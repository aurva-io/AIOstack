<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Data Assets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    html, body, #root { height: 100%; }
    body.canvas-host { background: #f0eee9; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body class="canvas-host">
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="data-assets-data.jsx"></script>
  <script type="text/babel" src="data-assets-detail.jsx"></script>
  <script type="text/babel" src="data-assets-page.jsx"></script>

  <script type="text/babel">
    // Minimal EmptyState (the AI Inventory file defines one too, but we keep
    // Data Assets self-contained when opened on its own).
    if (!window.EmptyState) {
      window.EmptyState = function EmptyState({ icon, title, message }) {
        return (
          <div style={{padding:'40px 20px', textAlign:'center', color:'var(--text-muted)'}}>
            <div style={{width:52, height:52, borderRadius:999, background:'var(--bg-muted)', display:'inline-flex', alignItems:'center', justifyContent:'center', marginBottom:10}}>
              <Icon name={icon} size={22}/>
            </div>
            <div style={{fontWeight:600, color:'var(--text)', marginBottom:4}}>{title}</div>
            <div style={{fontSize:13}}>{message}</div>
          </div>
        );
      };
    }

    function App() {
      const W = 1400, H = 940;
      return (
        <DesignCanvas>
          <DCSection id="data-assets" title="Data Assets — discovered datasources"
                     subtitle="Grouped by parent cluster (RDS writer + readers collapse together). Click any row to open its detail panel; click the workload count to jump to Connections.">
            <DCArtboard id="da-list" label="Default · 4-col, sorted by risk" width={W} height={H}>
              <div className="artboard-frame" style={{width:W, height:H}}>
                <DataAssetsPage />
              </div>
            </DCArtboard>
            <DCArtboard id="da-sensitive" label="Sensitive Data tab — Connect to Aurva" width={W} height={H}>
              <div className="artboard-frame" style={{width:W, height:H}}>
                <DataAssetsPage initialSelected={window.DA_ROWS[0]} initialTab="sensitive" />
              </div>
            </DCArtboard>
            <DCArtboard id="da-apps" label="Applications tab — S3 data-lake (5 apps)" width={W} height={H}>
              <div className="artboard-frame" style={{width:W, height:H}}>
                <DataAssetsPage initialSelected={window.DA_ROWS.find(r => r.id === 's3-data-lake-raw')} initialTab="applications" />
              </div>
            </DCArtboard>
            <DCArtboard id="da-risks" label="Risks tab — public S3 bucket" width={W} height={H}>
              <div className="artboard-frame" style={{width:W, height:H}}>
                <DataAssetsPage initialSelected={window.DA_ROWS.find(r => r.id === 's3-public-assets')} initialTab="risks" />
              </div>
            </DCArtboard>
          </DCSection>

          <DCPostIt x={30} y={40} w={260}>
            <b>4-column layout</b><br/>
            <b>1 · Datasource</b> — engine + version, ARN, hosting / account / region, role.<br/>
            <b>2 · Sensitive Data</b> — locked: "Connect to Aurva" (feature to be built).<br/>
            <b>3 · Applications &amp; Volume</b> — top apps with role + qps; storage size, tables, queries/day.<br/>
            <b>4 · Risks &amp; Threats</b> — severity-sorted, secondary breakdown by count.
          </DCPostIt>
          <DCPostIt x={30} y={260} w={260}>
            <b>Click behaviour</b><br/>
            Each column opens its matching tab in the side panel: Overview, Sensitive Data, Applications, Risks. Metadata holds raw provider JSON. Cluster rows still collapse readers under the writer.
          </DCPostIt>
        </DesignCanvas>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
